      - generic [ref=f6e37]:
        - heading "Bad experiences, fixed." [level=2] [ref=f6e38]
        - paragraph [ref=f6e39]: Every project here starts with something that went wrong for a real person. Then what I built, what was hard, and what happened.
      - article [ref=f6e40]:
        - generic [ref=f6e41]:
          - heading "Countdown Math Arena" [level=3] [ref=f6e42]
          - paragraph [ref=f6e43]: A numbers game everyone plays face to face, with no way to challenge a friend online.
          - generic [ref=f6e44]:
            - heading "What I built" [level=4] [ref=f6e45]
            - paragraph [ref=f6e46]: "A real-time multiplayer math duel. Two players get the same six numbers and a three-digit target, race the same timer, and the closest answer wins. Anyone can play: sign in with Google or make an account."
            - generic [ref=f6e47]:
              - heading "Try one round" [level=4] [ref=f6e48]
              - generic [ref=f6e49]:
                - paragraph [ref=f6e50]:
                  - generic [ref=f6e51]: Target
                  - status [ref=f6e52]: "146"
                - group "Number tiles" [ref=f6e53]:
                  - button "10" [ref=f6e54] [cursor=pointer]
                  - button "5" [ref=f6e55] [cursor=pointer]
                  - button "2" [ref=f6e56] [cursor=pointer]
                  - button "8" [ref=f6e57] [cursor=pointer]
                  - button "3" [ref=f6e58] [cursor=pointer]
                  - button "4" [ref=f6e59] [cursor=pointer]
                - group "Operators" [ref=f6e60]:
                  - button "plus" [ref=f6e61] [cursor=pointer]: +
                  - button "minus" [ref=f6e62] [cursor=pointer]: −
                  - button "times" [ref=f6e63] [cursor=pointer]: ×
                  - button "divide" [ref=f6e64] [cursor=pointer]: ÷
                - list "Your steps" [ref=f6e65]
                - status [ref=f6e66]: Pick a tile, an operator, then another tile.
                - generic [ref=f6e67]:
                  - button "Undo" [ref=f6e68] [cursor=pointer]
                  - button "Start over" [ref=f6e69] [cursor=pointer]
                  - button "New puzzle" [ref=f6e70] [cursor=pointer]
                - paragraph [ref=f6e71]: Combine two tiles at a time with + − × ÷. Subtraction stays positive and division must be exact. The closest tile to the target wins.
          - generic [ref=f6e72]:
            - heading "Hardest part" [level=4] [ref=f6e73]
            - paragraph [ref=f6e74]: I had little experience with TypeScript and had never built anything with WebSockets, so I learned the fundamentals before writing the real-time logic. The sockets sometimes drifted out of sync, so I played both sides of a match myself to test answers at the same time, disconnects and timeouts. I also wrote database functions and locked down the backend so players can’t cheat.
            - heading "What came out of it" [level=4] [ref=f6e75]
            - list [ref=f6e76]:
              - listitem [ref=f6e77]: "A server-authoritative game: match state, round timers and reconnects are decided on a dedicated Node.js and Socket.io server, not by the players’ browsers."
              - listitem [ref=f6e78]: An answer checker that verifies every expression and rejects invalid or late submissions.
              - listitem [ref=f6e79]: One atomic, repeat-safe database function saves each match, so rank points, wins and losses never double-count across 100+ matches played by 10+ users.
          - generic [ref=f6e80]:
            - heading "Try it" [level=4] [ref=f6e81]
            - paragraph [ref=f6e82]: Sign in with Google or register. Practice mode needs no opponent.
            - paragraph [ref=f6e83]: Built with Next.js, TypeScript, Socket.io, Node.js, Supabase, PostgreSQL and Tailwind CSS.
            - paragraph [ref=f6e84]:
              - link "Live demo of Countdown Math Arena (opens in a new tab)" [ref=f6e85] [cursor=pointer]:
                - /url: https://countdowngame-multiplayer.vercel.app/
                - text: Live demo
                - generic [ref=f6e86]: of Countdown Math Arena (opens in a new tab)
              - link "Source code for Countdown Math Arena (opens in a new tab)" [ref=f6e87] [cursor=pointer]:

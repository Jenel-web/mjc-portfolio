            - img "MJCINEMA Now Showing page with movie posters for Soul, Fly Away Home, Time to Hunt and The Tunnel to Summer" [ref=f6e145]
          - generic [ref=f6e146]:
            - heading "MJCINEMA" [level=4] [ref=f6e147]
            - paragraph [ref=f6e148]: Two people can click the same cinema seat at the same moment, and a booking system has to pick one.
            - paragraph [ref=f6e149]: "A cinema booking system: browse screenings, pick seats, pay from an in-app wallet and cancel for a refund. It was the first full-stack project I built on my own after learning Spring Boot."
            - list [ref=f6e150]:
              - listitem [ref=f6e151]: Booking and cancellation run inside transactions that roll back on failure, which prevents double-booking.
              - listitem [ref=f6e152]: JWT login, BCrypt-hashed passwords and role-based access with Spring Security.
              - listitem [ref=f6e153]: A layered REST API with DTOs, a query that detects overlapping showtimes and one global error handler.
            - paragraph [ref=f6e154]:
              - strong [ref=f6e155]: "Hardest part:"
              - text: building it from scratch while I was still learning. I debugged with as little AI as possible so I would learn the fundamentals, and I designed how the tables connect on my own.
            - paragraph [ref=f6e156]:
              - strong [ref=f6e157]: "Try it:"
              - text: the demo opens on a login page. Register an account to browse screenings, pick seats and pay with the wallet.
            - paragraph [ref=f6e158]: Built with Java 17, Spring Boot, JPA and Hibernate, MySQL, Docker, JavaScript, HTML and CSS.
            - paragraph [ref=f6e159]:
              - link "Live demo of MJCINEMA (opens in a new tab)" [ref=f6e160] [cursor=pointer]:

    - region [ref=f6e181]:
      - generic [ref=f6e182]:
        - heading "About Mark" [level=2] [ref=f6e183]
        - paragraph [ref=f6e184]: I’m an Information Technology student at the Polytechnic University of the Philippines, and I build applications around problems I’ve actually run into.
        - paragraph [ref=f6e185]:
          - text: I’m always curious about how the human mind and the economy work. That curiosity became
          - mark [ref=f6e186]: EconLens
          - text: ", an app that explains what a headline costs an ordinary household. It’s the one I’m still building."
        - paragraph [ref=f6e187]: I believe great software comes from understanding people, so I start every project from the bad experience, not the tech stack.
        - paragraph [ref=f6e188]: I use AI tools like Claude, ChatGPT and Gemini to move faster. I decide the design and check what they write. On MJCINEMA I deliberately debugged without them to learn the basics.
        - paragraph [ref=f6e189]: Outside of building, I watch a lot of movies and series.
        - paragraph [ref=f6e190]:
          - text: Right now I’m learning Docker, cloud basics and system design.
          - generic [ref=f6e191]: Updated October 2026.
        - paragraph [ref=f6e192]:
          - strong [ref=f6e193]: Mark Jenel Cortas
          - text: Software developer, looking for an internship

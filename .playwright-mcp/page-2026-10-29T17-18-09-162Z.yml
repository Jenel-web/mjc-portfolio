          - generic [ref=f6e167]:
            - heading "Pag-IBIG Housing Loan App" [level=4] [ref=f6e168]
            - paragraph [ref=f6e169]: Applying for a housing loan means forms, supporting documents and in-person steps.
            - paragraph [ref=f6e170]: A web app where borrowers apply with their collateral and admins approve or reject, with a preview of monthly payments before anyone commits. A school project I led.
            - list [ref=f6e171]:
              - listitem [ref=f6e172]: A Spring Boot REST API with 23 endpoints, using DTOs to keep the API’s shape separate from the database entities.
              - listitem [ref=f6e173]: A 6-entity MySQL schema modeled in Hibernate, including a composite-key entity that links loans to properties.
              - listitem [ref=f6e174]: The database is hosted on Aiven, so nobody on the team had to change environment variables after pulling from main.
            - paragraph [ref=f6e175]:
              - strong [ref=f6e176]: "Hardest part:"
              - text: most of my classmates were heading into other areas of IT, so I taught the team how to use AI tools well, which folders were safe to edit and how to navigate the database. It pushed me to learn more so I could support them.
            - paragraph [ref=f6e177]: Built with Java 17, Spring Boot, Spring Security, MySQL, React, TypeScript, Vite, Tailwind CSS and Figma.
            - paragraph [ref=f6e178]:
              - link "Source code for Pag-IBIG Housing Loan App (opens in a new tab)" [ref=f6e179] [cursor=pointer]:

      - article [ref=f6e94]:
        - generic [ref=f6e95]:
          - heading "CheatNoNo" [level=3] [ref=f6e96]
          - paragraph [ref=f6e97]: Professors give Google Forms exams and can’t see what students do in their other tabs.
          - generic [ref=f6e98]:
            - heading "What I built" [level=4] [ref=f6e99]
            - paragraph [ref=f6e100]: A Chrome extension for students and a live dashboard for professors. The extension tracks activity during the exam and blocks AI chatbots and messaging sites. The dashboard shows who left the exam, when, and for how long, plus an integrity score for each student. The score is a prompt to review, never a verdict, and monitoring stops when the student submits.
            - heading "Hardest part" [level=4] [ref=f6e101]
            - paragraph [ref=f6e102]: "The assignment was vague: detect or block cheating on Google Forms, with no instructions. So the hardest part was deciding what to build. I designed the system flow myself and chose to track and report instead of only blocking, so the professor makes the final call."
          - generic [ref=f6e103]:
            - heading "What came out of it" [level=4] [ref=f6e104]
            - list [ref=f6e105]:
              - listitem [ref=f6e106]: Watched 100+ students at the same time across 2 live exams and flagged 100+ integrity violations.
              - listitem [ref=f6e107]: Audit logs are protected with PostgreSQL row-level security and atomic database functions, so a student can’t tamper with their own record from the browser.
              - listitem [ref=f6e108]: Reconciling Google Forms submissions against live activity takes about 20 seconds per exam, down from 10 minutes.
            - heading "Try it" [level=4] [ref=f6e109]
            - paragraph [ref=f6e110]:
              - text: The demo opens on a teacher sign-in. Create an account, confirm the email, then add a test with a Google Forms link. The student extension loads unpacked in desktop Chrome. I wrote a full setup guide;
              - link "ask and I’ll send it" [ref=f6e111] [cursor=pointer]:
                - /url: "#contact"
              - text: .
            - paragraph [ref=f6e112]: Built with TypeScript, React, Vite, a Chrome extension (Manifest V3), Supabase, PostgreSQL and Playwright.
            - paragraph [ref=f6e113]:
              - link "Live demo of CheatNoNo (opens in a new tab)" [ref=f6e114] [cursor=pointer]:
                - /url: https://cheatnono.vercel.app/
                - text: Live demo
                - generic [ref=f6e115]: of CheatNoNo (opens in a new tab)
              - link "Source code for CheatNoNo (opens in a new tab)" [ref=f6e116] [cursor=pointer]:
                - /url: https://github.com/Jenel-web/google-forms-anticheat-system
                - text: Source code
                - generic [ref=f6e117]: for CheatNoNo (opens in a new tab)
        - 'img "CheatNoNo teacher sign-in page: the headline “Fair exams, calmly kept.” beside a Welcome, teacher sign-in form" [ref=f6e120]'
      - article [ref=f6e121]:
        - generic [ref=f6e122]:
          - heading "EconLens" [level=3] [ref=f6e123]
          - paragraph [ref=f6e124]: Fuel prices climbed and every headline said so, but nobody explained what a 15-peso rise means for an ordinary household.
          - generic [ref=f6e125]:
            - heading "What I’m building" [level=4] [ref=f6e126]
            - paragraph [ref=f6e127]: A mobile app that pulls Philippine economic news and uses AI to explain each story in plain Filipino. Every headline carries an impact level, like Critical or Stabilized, and a short breakdown of how it could hit an average Filipino’s budget.
          - generic [ref=f6e128]:
            - heading "Hardest part" [level=4] [ref=f6e129]
            - paragraph [ref=f6e130]: "Getting the AI to answer consistently was one challenge. Defining “impact on an average Filipino” was the harder one. There is no single average Filipino: a daily commuter, a motorcycle rider and someone who rarely drives all feel a fuel hike differently, so one “you’ll spend ₱500 more” figure can mislead. I had to define those everyday situations and measure impact so it stays realistic from one story to the next."
          - generic [ref=f6e131]:
            - heading "Where it stands" [level=4] [ref=f6e132]
            - paragraph [ref=f6e133]: Still being built, and the project I’m learning the most from. There is no live demo yet; the code is public.
            - paragraph [ref=f6e134]: Built with Flutter, Dart, Supabase and Python.
            - paragraph [ref=f6e135]:
              - link "Source code for EconLens (opens in a new tab)" [ref=f6e136] [cursor=pointer]:
                - /url: https://github.com/Jenel-web/econlens
                - text: Source code
                - generic [ref=f6e137]: for EconLens (opens in a new tab)
        - generic [ref=f6e139]:
          - 'img "EconLens home screen: filters for All News, Fuel Prices, Basic Goods and Transport above a list of headlines, each tagged Critical or Stabilized"'
          - 'img "EconLens article screen in Filipino: what happened, how it affects us, and which areas are affected"'
          - 'img "EconLens estimated budget impact: about 300 pesos more a month for gasoline, and practical tips"'
